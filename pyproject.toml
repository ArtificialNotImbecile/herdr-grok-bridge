[project]
name = "herdr-grok-bridge"
version = "0.1.2"
description = "Unofficial read-only Herdr MCP bridge for Grok Bot (list agents, status, bounded pane reads)."
readme = "README.md"
authors = [
    { name = "herdr-grok-bridge contributors" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "herdr", "readonly", "grok"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Terminals",
    "Intended Audience :: Developers",
]
dependencies = [
    "mcp>=2.3,<3",
]

[project.urls]
Repository = "https://github.com/ArtificialNotImbecile/herdr-grok-bridge"
Herdr = "https://herdr.dev"

[project.scripts]
herdr-grok-bridge = "herdr_grok_bridge.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/herdr_grok_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
